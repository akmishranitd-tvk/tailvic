<div class="breed-gallery">{% for slug,name,copy in breeds %}{% set visual=breed_visuals[slug] %}<a class="breed-card" href="/care-guides/breeds/{{ slug }}/"><img src="{{ url_for('static',filename='images/'+visual.image) }}" alt="{{ visual.alt }}" width="640" height="480" loading="lazy"><div><h3>{{ name }}</h3><span aria-hidden="true">↗</span></div><p>{{ copy }}</p></a>{% endfor %}</div>
